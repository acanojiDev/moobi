<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sellar copa · Moobi</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0E0A0F" />
  <script type="module" crossorigin src="./assets/sello-CfTcw5Np.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/tarjeta-CYrPfO_I.js">
  <link rel="stylesheet" crossorigin href="./assets/sello-BnSSCz57.css">
</head>
<body>
  <main class="barra">
    <p class="barra__marca">Moobi</p>
    <h1 data-titulo>Sellar copa</h1>
    <p class="barra__estado" data-estado></p>
    <ol class="stamps" data-stamps hidden></ol>
    <form class="barra__login" data-login hidden>
      <label>Correo de la barra
        <input type="email" name="email" autocomplete="username" required />
      </label>
      <label>Contraseña
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button class="btn" type="submit">Entrar</button>
      <p class="barra__error" data-login-error role="alert"></p>
    </form>
    <button class="btn btn--grande" type="button" data-accion hidden>Sellar esta copa</button>
    <p class="barra__error" data-error role="alert"></p>
  </main>
</body>
</html>
